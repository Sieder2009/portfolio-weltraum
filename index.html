<!doctype html>
<html lang="de" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020309" />
    <meta name="color-scheme" content="dark" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#panel">Zum Inhalt springen</a>

    <div id="stage" class="stage" aria-hidden="true">
      <canvas id="webgl"></canvas>
    </div>
    <div class="fx fx-vignette" aria-hidden="true"></div>
    <div class="fx fx-grain" aria-hidden="true"></div>

    <div id="labels" class="labels"></div>

    <header id="topbar" class="topbar"></header>

    <main>
      <section id="hero" class="hero" aria-labelledby="hero-title"></section>
      <aside id="panel" class="panel" aria-labelledby="panel-title"></aside>
    </main>

    <nav id="dock" class="dock" aria-label="Planeten"></nav>

    <div id="menu" class="menu" role="dialog" aria-modal="true" aria-label="Navigation" hidden></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="loader" class="loader" aria-hidden="true"></div>

    <noscript>
      <p class="noscript">Diese Seite braucht JavaScript, um das Sonnensystem darzustellen.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
